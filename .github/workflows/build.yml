name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  SING_BOX_VERSION: v1.12.0     # libbox API in Platform.kt matches 1.12.x

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }

      - name: Build libbox.aar (sing-box core for Android)
        run: |
          git clone --depth 1 -b "$SING_BOX_VERSION" https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          make lib_install
          go run ./cmd/internal/build_libbox -target android
          cp libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: V2Picker-apk
          path: app/build/outputs/apk/release/*.apk
